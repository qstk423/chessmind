<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#163227">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChessCouncil">
<title>对弈 · ChessCouncil</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/chessboard-1.0.0.min.css">
<link rel="stylesheet" href="style.css?v=mapp8">
<link rel="stylesheet" href="/shared/variant-switch.css">
</head>
<body class="page-play" data-page="play">
<div class="app-shell">
  <header class="topbar topbar-compact">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <h1>ChessCouncil</h1>
    </div>
    <nav class="variant-switch" aria-label="棋种">
      <a href="/chess/" data-variant-link="chess">国际象棋</a>
      <a href="/xiangqi/" data-variant-link="xiangqi">中国象棋</a>
    </nav>
    <div class="topbar-meta">
      <span id="game-status" class="pill pill-soft">白方先行</span>
    </div>
  </header>

  <p id="ops-banner" class="ops-banner" hidden role="status"></p>
  <p id="pitch-cue" class="pitch-cue" hidden></p>
  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <div id="council-progress" class="council-progress" hidden>
    <span class="spinner" aria-hidden="true"></span>
    <span id="council-progress-text">分析中…</span>
  </div>

  <div class="stage stage-mobile">
    <section class="board-panel">
      <div class="setup-bar" aria-label="对局设置">
        <label class="field">
          <span>模式</span>
          <select id="game-mode">
            <option value="human_vs_ai" selected>人 vs AI</option>
            <option value="human_vs_human">人人</option>
            <option value="ai_vs_ai">AI vs AI</option>
          </select>
        </label>
        <label class="field">
          <span>执棋</span>
          <select id="human-color">
            <option value="white">白</option>
            <option value="black">黑</option>
          </select>
        </label>
        <label class="field">
          <span>白方 AI</span>
          <select id="white-ai">
            <option value="llm">LLM</option>
            <option value="engine">引擎</option>
          </select>
        </label>
        <label class="field check">
          <input type="checkbox" id="with-analysis" checked>
          <span>Council</span>
        </label>
        <label class="field" id="analysis-mode-field">
          <span>分析</span>
          <select id="analysis-mode">
            <option value="fast" selected>快评</option>
            <option value="deep">深评</option>
          </select>
        </label>
        <button id="btn-new-game" class="accent setup-new" type="button">新对局</button>
      </div>

      <div class="online-bar" id="online-bar" hidden>
        <div class="online-copy">
          <strong>联机</strong>
          <span id="online-status">未加入</span>
        </div>
        <div class="online-controls">
          <button id="btn-room-copy" type="button">复制链接</button>
          <button id="btn-room-leave" type="button">退出联机</button>
        </div>
      </div>

      <div class="board-frame">
        <div id="board"></div>
      </div>

      <div class="board-controls">
        <div class="board-controls-main">
          <button id="btn-undo" type="button">悔棋</button>
          <button id="btn-hint" type="button">提示</button>
          <button id="btn-ai-step" class="accent" type="button">AI 一步</button>
          <button id="btn-flip" type="button">翻转</button>
        </div>
      </div>

      <div class="playback-bar">
        <div class="ply-nav" role="group">
          <button id="btn-ply-start" type="button">开局</button>
          <button id="btn-ply-prev" type="button">后退</button>
          <button id="btn-play-toggle" class="ply-play" type="button">播放</button>
          <button id="btn-ply-next" type="button">前进</button>
          <button id="btn-ply-end" type="button">最新</button>
        </div>
        <div class="playback-meta">
          <span id="ply-nav-label" class="ply-nav-label">开局</span>
          <label class="speed-field">
            <span>速度</span>
            <select id="playback-speed">
              <option value="1800">慢</option>
              <option value="900" selected>中</option>
              <option value="450">快</option>
              <option value="220">极快</option>
            </select>
          </label>
        </div>
      </div>

      <div class="lib-bar" id="lib-bar" hidden>
        <span id="lib-status" class="lib-status"></span>
        <div class="lib-bar-actions">
          <button id="btn-lib-step" type="button" disabled>下一步</button>
          <button id="btn-lib-auto" type="button" disabled>自动演示</button>
          <button id="btn-lib-stop" type="button" disabled>停止</button>
          <button id="btn-lib-ai" type="button" disabled>AI 代下</button>
        </div>
      </div>

      <div id="move-list" class="move-list"></div>
      <p id="challenge-hud" class="challenge-hud" hidden></p>
      <p id="ai-meta" class="ai-meta">走棋后下滑查看 Council</p>

      <div id="fen-editor" class="fen-editor" hidden>
        <p class="tool-hint">纠错：点选棋子后点格子放置；空擦除。</p>
        <div id="piece-palette" class="piece-palette"></div>
        <div class="fen-editor-row">
          <select id="edit-turn"><option value="w">白</option><option value="b">黑</option></select>
          <button id="btn-apply-fen" type="button">确认</button>
          <button id="btn-apply-analyze" type="button">确认并分析</button>
          <button id="btn-cancel-edit" type="button">退出</button>
        </div>
        <code id="edit-fen-preview" class="fen-preview"></code>
      </div>
    </section>

    <aside class="council-panel">
      <div id="coach-takeaway" class="coach-takeaway" hidden>
        <span class="takeaway-kicker">本步记住</span>
        <p id="coach-takeaway-text" class="takeaway-text"></p>
      </div>
      <div class="eval-row">
        <div class="eval-bar">
          <div class="eval-white" id="eval-white" style="height:50%"></div>
          <div class="eval-black" id="eval-black" style="height:50%"></div>
        </div>
        <div class="eval-copy">
          <div id="move-class" class="move-class">等待着法</div>
          <div class="eval-text">
            <span id="white-prob">白 50%</span>
            <span id="black-prob">黑 50%</span>
          </div>
        </div>
      </div>
      <div id="disagreement-panel" class="disagreement-panel">
        <div class="dg-head">
          <span class="dg-title">三位分析师</span>
          <span id="dg-label" class="dg-label">待命</span>
        </div>
        <div class="dg-bar"><div id="dg-fill" class="dg-fill" style="width:0%"></div></div>
        <div id="dg-compare" class="dg-compare">
          <div class="dg-card" data-role="tactical">
            <span class="dg-role">战术</span>
            <span class="dg-move" id="dg-move-tactical">—</span>
            <span class="dg-state" id="dg-state-tactical">待命</span>
          </div>
          <div class="dg-card" data-role="strategic">
            <span class="dg-role">战略</span>
            <span class="dg-move" id="dg-move-strategic">—</span>
            <span class="dg-state" id="dg-state-strategic">待命</span>
          </div>
          <div class="dg-card" data-role="risk">
            <span class="dg-role">风险</span>
            <span class="dg-move" id="dg-move-risk">—</span>
            <span class="dg-state" id="dg-state-risk">待命</span>
          </div>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="summary" type="button">教练</button>
        <button class="tab" data-tab="tactical" type="button">战术</button>
        <button class="tab" data-tab="strategic" type="button">战略</button>
        <button class="tab" data-tab="risk" type="button">风险</button>
        <button class="tab" data-tab="debate" type="button">辩论</button>
      </div>
      <div class="tab-content active" id="tab-summary"><p class="placeholder">走棋后给出本步要点</p></div>
      <div class="tab-content" id="tab-tactical"><p class="placeholder">战术</p></div>
      <div class="tab-content" id="tab-strategic"><p class="placeholder">战略</p></div>
      <div class="tab-content" id="tab-risk"><p class="placeholder">风险</p></div>
      <div class="tab-content" id="tab-debate"><p class="placeholder">辩论</p></div>
      <div class="council-footer">
        <button id="btn-review" type="button">赛后复盘</button>
        <label class="field compact">
          <span>教练</span>
          <select id="coach-level">
            <option value="beginner">入门</option>
            <option value="intermediate" selected>中级</option>
            <option value="advanced">高级</option>
          </select>
        </label>
        <label class="field compact">
          <span>引擎</span>
          <select id="engine-depth">
            <option value="8">8</option>
            <option value="12" selected>12</option>
            <option value="15">15</option>
          </select>
        </label>
      </div>
      <details class="tool-block review-inline" id="review-section" style="display:none" open>
        <summary>复盘报告</summary>
        <div id="review-result"></div>
      </details>
    </aside>
  </div>
</div>

<nav class="app-tabbar" aria-label="主导航">
  <a class="tabbar-item is-active" href="index.html" aria-current="page">对弈</a>
  <a class="tabbar-item" href="learn.html">学习</a>
  <a class="tabbar-item" href="online.html">联机</a>
  <a class="tabbar-item" href="tools.html">工具</a>
</nav>

<div id="finale-overlay" class="finale-overlay" hidden aria-hidden="true">
  <div class="finale-backdrop"></div>
  <div class="finale-stage" data-mate="checkmate">
    <div class="finale-fx" aria-hidden="true">
      <span class="fx-ring"></span>
      <span class="fx-ring fx-ring-2"></span>
      <span class="fx-beam fx-beam-a"></span>
      <span class="fx-beam fx-beam-b"></span>
      <span class="fx-cage"></span>
      <span class="fx-rank"></span>
    </div>
    <p class="finale-kicker" id="finale-kicker">对局结束</p>
    <h2 class="finale-title" id="finale-title">将死！</h2>
    <p class="finale-sub" id="finale-sub">Checkmate</p>
    <p class="finale-blurb" id="finale-blurb"></p>
    <div class="finale-actions">
      <button type="button" id="finale-review" class="accent">看复盘</button>
      <button type="button" id="finale-close">继续</button>
      <button type="button" id="finale-new">再来一局</button>
    </div>
  </div>
</div>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="vendor/chessboard-1.0.0.min.js"></script>
<script src="vendor/chess-0.10.3.min.js"></script>
<script src="/shared/variant-switch.js"></script>
<script src="app.js?v=mapp13"></script>
</body>
</html>
