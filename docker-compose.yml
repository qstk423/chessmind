services:
  chesscouncil:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      STOCKFISH_PATH: /usr/games/stockfish
      HOST: "0.0.0.0"
      PORT: "8000"
    volumes:
      - chesscouncil-data:/app/data
      - chesscouncil-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  chesscouncil-data:
  chesscouncil-logs:
